{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 text-center">
    <h1 class="mb-4">欢迎使用实验报告提交平台</h1>
    <p class="lead">学生请使用学号登录提交Word实验报告，系统自动生成成绩与评语，并在封面添加红色标注。</p>
    <div class="d-flex justify-content-center gap-3 mt-4">
      <a class="btn btn-primary btn-lg" href="{{ url_for('auth.student_login') }}">学生登录</a>
      <a class="btn btn-outline-secondary btn-lg" href="{{ url_for('auth.admin_login') }}">管理员登录</a>
    </div>
  </div>
</div>
{% endblock %}
