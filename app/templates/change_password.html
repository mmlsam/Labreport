{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h2 class="mb-4">{{ heading }}</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="current_password">当前密码</label>
    <input class="form-control" id="current_password" name="current_password" type="password" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="new_password">新密码</label>
    <input class="form-control" id="new_password" name="new_password" type="password" required>
  </div>
  <div class="mb-4">
    <label class="form-label" for="confirm_password">确认新密码</label>
    <input class="form-control" id="confirm_password" name="confirm_password" type="password" required>
  </div>
  <button class="btn btn-primary" type="submit">{{ submit_text }}</button>
</form>
{% endblock %}
